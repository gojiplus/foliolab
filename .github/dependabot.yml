version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    ignore:
      # Keep the type surface aligned with the minimum supported Node runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # These updates need a regenerated, reviewed Action bundle.
      action-runtime:
        applies-to: version-updates
        patterns: ["@actions/core", "@octokit/rest", "openai", "zod", "esbuild"]
        update-types: ["minor", "patch"]
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns: ["@actions/core", "@octokit/rest", "openai", "zod", "esbuild"]
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
