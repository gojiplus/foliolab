name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide eligibility
        id: gate
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          GROUP: ${{ steps.metadata.outputs.dependency-group }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          eligible=false
          if [ "$ECOSYSTEM" = "github_actions" ]; then
            case "$UPDATE_TYPE" in
              version-update:semver-major|version-update:semver-minor|version-update:semver-patch)
                eligible=true ;;
            esac
            if [ "$GROUP" = "actions-minor-and-patch" ]; then
              eligible=true
            fi
          elif [ "$ECOSYSTEM" = "npm_and_yarn" ] && [ "$GROUP" != "action-runtime" ]; then
            case "$UPDATE_TYPE" in
              version-update:semver-minor|version-update:semver-patch) eligible=true ;;
            esac
            if [ "$GROUP" = "npm-minor-and-patch" ]; then
              eligible=true
            fi
          fi
          echo "ecosystem=$ECOSYSTEM group=$GROUP update-type=$UPDATE_TYPE eligible=$eligible"
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge for eligible updates
        if: steps.gate.outputs.eligible == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
