name: Organization website

on:
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate all summaries
        type: boolean
        default: false
  schedule:
    - cron: '17 3 1 * *'
  push:
    branches: [main]
    paths:
      - foliolab.config.json
      - .github/workflows/organization-site.yml

permissions:
  contents: read

concurrency:
  group: organization-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate organization site
        id: foliolab
        uses: gojiplus/foliolab@REPLACE_WITH_COMMIT_SHA
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          force: ${{ inputs.force || false }}
      - name: Save changed portfolio data
        if: steps.foliolab.outputs.data-changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- foliolab-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update organization portfolio data'
            git push
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
